<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gracias - Gracia Tech</title>

    <link rel="stylesheet" href="css/styles.css" />

    <style>
      body {
        background: #f8fafc;
        font-family: "Montserrat", sans-serif;
        text-align: center;
        padding: 60px 20px;
      }

      .box {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      img.logo {
        width: 140px;
        margin-bottom: 20px;
      }

      h1 {
        color: #0ca3ba;
        font-size: 32px;
        margin-bottom: 10px;
      }

      p {
        color: #555;
        font-size: 16px;
        margin-bottom: 25px;
      }

      a.btn {
        display: inline-block;
        background: #0ca3ba;
        color: white;
        padding: 12px 22px;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.2s ease;
      }

      a.btn:hover {
        background: #087a8e;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <img src="assets/images/logo.png" class="logo" alt="Gracia Tech Logo" />

      <h1>¡Mensaje enviado con éxito!</h1>

      <p>
        Gracias por comunicarte con <strong>Gracia Tech</strong>.<br />
        Nuestro equipo se pondrá en contacto contigo muy pronto 💙
      </p>

      <a href="index.html" class="btn">Volver al inicio</a>
    </div>
  </body>
</html>
