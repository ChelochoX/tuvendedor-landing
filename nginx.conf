# ===========================================
# 🌐 NGINX Reverse Proxy - TuVendedor + GraciaTech
# Autor: César Lezcano
# ===========================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ===================== LOGS =====================
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ===================== SEGURIDAD BÁSICA =====================
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ===================== HTTP → HTTPS =====================
    server {
        listen 80;
        server_name tuvendedor.com.py www.tuvendedor.com.py api.tuvendedor.com.py;

        return 301 https://$host$request_uri;
    }

    server {
        listen 80;
        server_name graciatech.com.py www.graciatech.com.py autoagenda.graciatech.com.py sgademo.graciatech.com.py;

        return 301 https://$host$request_uri;
    }

    # =======================================================================
    # ✅ HTTPS: TUVENDEDOR WEB PRINCIPAL
    # =======================================================================
    server {
        listen 443 ssl;
        server_name tuvendedor.com.py www.tuvendedor.com.py;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header X-Origin-Proxy "nginx_proxy_tuvendedor_web" always;

        # ---------------------------------------
        # 🔗 SHARE / OPEN GRAPH PREVIEW
        #
        # IMPORTANTE:
        # Esta ruta NO debe ir al frontend React.
        # Debe ir al backend .NET porque el ShareController
        # genera el HTML con og:title, og:image, og:description.
        #
        # Ejemplo:
        # https://www.tuvendedor.com.py/share/producto/13
        # ---------------------------------------
        location ^~ /share/ {
            proxy_pass http://market_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }

        # ---------------------------------------
        # ⚙️ BACKEND API .NET
        #
        # El front usa:
        # VITE_API_URL=https://www.tuvendedor.com.py/api
        #
        # Ejemplo:
        # https://www.tuvendedor.com.py/api/Publicaciones/obtener-publicaciones
        # ---------------------------------------
        location ^~ /api/ {
            proxy_pass http://market_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;

            client_max_body_size 50M;
        }

        # ---------------------------------------
        # 🌐 FRONTEND REACT / VITE
        #
        # Todo lo que no sea /share/ ni /api/
        # va al frontend.
        # ---------------------------------------
        location / {
            proxy_pass http://market_frontend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }
    }

    # =======================================================================
    # ✅ HTTPS: API TUVENDEDOR
    #
    # Opcional, pero útil si querés acceder directo al backend:
    # https://api.tuvendedor.com.py/swagger
    # https://api.tuvendedor.com.py/share/producto/13
    #
    # Si tu certificado no cubre api.tuvendedor.com.py,
    # tenés que agregar ese subdominio al certificado SSL.
    # =======================================================================
    server {
        listen 443 ssl;
        server_name api.tuvendedor.com.py;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header X-Origin-Proxy "nginx_proxy_tuvendedor_api" always;

        location / {
            proxy_pass http://market_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;

            client_max_body_size 50M;
        }
    }

    # =======================================================================
    # 🏠 HTTPS: LANDING PAGE GRACIATECH
    # =======================================================================
    server {
        listen 443 ssl;
        server_name graciatech.com.py www.graciatech.com.py;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        add_header X-Origin-Proxy "nginx_proxy_graciatech" always;

        # ---------------------------------------
        # API contacto GraciaTech
        # ---------------------------------------
        location /api/contact {
            proxy_pass http://graciatech_contact_api:8080/api/contact;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }

        # ---------------------------------------
        # Landing page
        # ---------------------------------------
        location / {
            proxy_pass http://landing_page;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }
    }
}